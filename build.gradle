plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
    id 'maven-publish'
}
group = 'top.mc_plfd_host'
version = '1.0.0'
base { archivesName = 'ingamemusic' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}
dependencies {
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.13'
    testImplementation 'de.maxhenkel.voicechat:voicechat-api:2.6.13'
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11'
    ['aac', 'mp3', 'vorbis', 'flac', 'opus'].each { codec ->
        implementation include("io.github.jseproject:jse-spi-${codec}:1.1.0")
    }
    implementation include('io.github.jseproject:jse-api:1.1.0')
    implementation include('com.googlecode.soundlibs:tritonus-share:0.3.7.4')
    implementation include('org.gagravarr:vorbis-java-core:0.8')
    implementation include('net.jthink:jaudiotagger:3.0.1')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform(); systemProperty 'java.awt.headless', 'true' }

jar { from('LICENSE') { rename { 'LICENSE-ingamemusic' } } }

// Optional read-only ABI verification against a locally installed IMBlocker; never bundled.
if (providers.gradleProperty('imblockerTestJar').isPresent()) {
    test {
        def imblockerJar = file(providers.gradleProperty('imblockerTestJar').get())
        inputs.file(imblockerJar)
        systemProperty 'imblocker.testJar', imblockerJar.absolutePath
    }
}

if (providers.gradleProperty('voicechatTestJar').isPresent()) {
    test {
        def voicechatJar = file(providers.gradleProperty('voicechatTestJar').get())
        inputs.file(voicechatJar)
        systemProperty 'voicechat.testJar', voicechatJar.absolutePath
    }
}
